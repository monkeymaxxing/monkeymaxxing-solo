{{- /*
  The lines of pg_hba.conf that let each app's role log in to its database:
  /etc/postgresql/pg_hba_logins_of_the_apps.conf, which the cluster's
  pg_hba.conf includes. The template reads the role inputs apps and
  private_ip. Apps sharing a database share the database's lines.
*/ -}}
{{- $database_names := list -}}
{{- range $app_name, $app := .inputs.apps -}}{{- $database_names = append $database_names $app.database_name -}}{{- end -}}
{{- $database_names = uniq $database_names -}}
# Managed by MMX from roles/postgres_and_backups/files/pg_hba_logins_of_the_apps.conf
# in the systems repository. Each app's role logs in to its own database,
# with its password, from solo01's own WireGuard address: the apps'
# containers use the server's network, so their connections to Postgres
# come from there. Nothing else may log in over the network.
{{- range $database_names }}
host    {{ . }}   {{ . }}   {{ $.inputs.private_ip }}/32   scram-sha-256
{{- end }}
