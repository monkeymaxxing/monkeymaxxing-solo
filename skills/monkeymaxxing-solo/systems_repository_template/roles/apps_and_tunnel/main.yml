# Everything that runs the apps on solo01: each app's web and job containers
# (Podman runs the containers, Quadlet describes each as an ordinary systemd
# service), Caddy, which sends each request to the app's live web container,
# and cloudflared, the tunnel connector, which brings the requests in from
# Cloudflare. cloudflared opens outgoing connections to Cloudflare, so no web
# port is open on solo01.
#
# Two playbooks call this role:
# - solo_server sets the server up (set_up_the_server: true) and keeps the
#   release each app runs: only a deploy changes a release.
# - deploy calls it once for each deploy step.
#
# Each app has two web ports, web_port_a and web_port_b, and uses them in
# turn. Before the role's calls, the playbook's stage
# find_the_live_and_new_web_ports gives, for each app, the live web container
# (the one Caddy sends requests to: its port, and the image it runs) and the
# new one (the other port, with the image that deployed_image_tags names).
# What runs at each release_step, and where Caddy sends the requests once
# that step of the deploy is done:
#
# release_step                          web containers  Caddy sends to  job container runs
# keep_the_running_release              live            live            the live release
# start_the_new_release_beside_the_old  live and new    live            the live release
# send_requests_to_the_new_release      live and new    new             the live release
# stop_the_old_release                  new             new             the new release
inputs:
  set_up_the_server:                        # true only from solo_server: packages, programs, settings and secrets
    type: boolean
    required: true
  # A release_step value from the four rows in the table above.
  release_step:
    type: string
    required: true
  private_ip:                               # solo01's WireGuard address, where Postgres listens
    type: string
    required: true
  apps:                                     # vars.apps from mmx_project_settings.yml
    type: mapping
    required: true
  public_host_names:                        # each app's host name, from the inventory
    type: mapping
    required: true
  # The outputs of find_the_live_and_new_web_ports: for each app, its web_port
  # and image, for the live release and for the new one.
  live_web_containers:
    type: mapping
    required: true
  new_web_containers:
    type: mapping
    required: true
  container_registry_username:              # the read-only login the server pulls the apps' images with
    type: string
    required: true
  container_registry_password:
    type: string
    required: true
    secret: true
  # Only with set_up_the_server: true.
  cloudflare_tunnel_token:                  # the token of the tunnel that brings the requests in
    type: string
    required: false
    secret: true
  app_secrets:                              # <database_name>_database_password, and <app>_<VARIABLE> for each name in an app's secrets_from_vault
    type: mapping
    required: false
    secret: true
  nightly_work_starts_at:                   # vars.nightly_work_starts_at: UTC "HH:MM"; the image cleanup follows from it
    type: string
    required: false
  weekly_work_day:                          # vars.weekly_work_day: the image cleanup
    type: string
    required: false

node_tasks:
  - id: check_the_release_step
    assert:
      that:
        any:
          - {equals: ["{{ .inputs.release_step }}", keep_the_running_release]}
          - {equals: ["{{ .inputs.release_step }}", start_the_new_release_beside_the_old]}
          - {equals: ["{{ .inputs.release_step }}", send_requests_to_the_new_release]}
          - {equals: ["{{ .inputs.release_step }}", stop_the_old_release]}
      message: "release_step is {{ .inputs.release_step }}, which is none of the four in roles/apps_and_tunnel/main.yml"

  # work_out_what_runs_at_this_release_step uses release_step and the table
  # above to set three answers: does the live release run, does the new
  # release run, and does Caddy send requests to the new release?
  - id: work_out_what_runs_at_this_release_step
    set_vars:
      live_release_runs:
        not: {equals: ["{{ .inputs.release_step }}", stop_the_old_release]}
      new_release_runs:
        not: {equals: ["{{ .inputs.release_step }}", keep_the_running_release]}
      requests_go_to_the_new_release:
        any:
          - {equals: ["{{ .inputs.release_step }}", send_requests_to_the_new_release]}
          - {equals: ["{{ .inputs.release_step }}", stop_the_old_release]}

  # Setting the server up, from solo_server. --------------------------------

  # The containers run as root's system containers, on the server's own
  # network (Network=host in their Quadlet files). curl checks the
  # containers' health URLs.
  - id: install_podman_and_curl
    when: "{{ .inputs.set_up_the_server }}"
    apt_package:
      packages:
        - {name: podman, version: newest_when_first_installed}
        - {name: curl, version: newest_when_first_installed}

  # Two programs the deploy uses, installed ahead of it: one fills a web
  # container's asset directory (asset bridging), one runs an app's
  # migrations in a one-off container.
  - id: install_the_program_that_fills_web_asset_directories
    when: "{{ .inputs.set_up_the_server }}"
    file:
      path: /usr/local/sbin/fill_web_asset_directory
      source: files/fill_web_asset_directory
      owner: root
      group: root
      permissions_mode: "0755"
  - id: install_the_program_that_runs_app_migrations
    when: "{{ .inputs.set_up_the_server }}"
    file:
      path: /usr/local/sbin/run_app_migrations
      source: files/run_app_migrations
      owner: root
      group: root
      permissions_mode: "0755"

  # /var/lib/solo/live_web_ports/<app> holds the port Caddy sends the app's
  # requests to; web_assets/<container> holds the asset files each web
  # container mounts.
  - id: create_the_state_directory_of_solo
    when: "{{ .inputs.set_up_the_server }}"
    directory:
      path: /var/lib/solo
      owner: root
      group: root
      permissions_mode: "0755"
  - id: create_the_directory_of_the_live_web_ports
    when: "{{ .inputs.set_up_the_server }}"
    directory:
      path: /var/lib/solo/live_web_ports
      owner: root
      group: root
      permissions_mode: "0755"
  - id: create_the_directory_of_the_web_assets
    when: "{{ .inputs.set_up_the_server }}"
    directory:
      path: /var/lib/solo/web_assets
      owner: root
      group: root
      permissions_mode: "0755"

  # Each app's containers and migrations read three files:
  # - /etc/<app>/<app>_settings.env: the plain settings.
  # - /etc/<app>/<app>.env: the secrets.
  # - /etc/<app>/<app>_database.env: DATABASE_URL and DATABASE_READ_URL.
  # A change to any of them restarts the app's live web container in place,
  # and its job container.
  - id: create_the_settings_directory_of_each_app
    when: "{{ .inputs.set_up_the_server }}"
    loop: "{{ .inputs.apps }}"
    as: app
    directory:
      path: "/etc/{{ .app.key }}"
      owner: root
      group: root
      permissions_mode: "0755"
  - id: settings_and_secrets_of_each_app
    when: "{{ .inputs.set_up_the_server }}"
    loop: "{{ .inputs.apps }}"
    as: app
    key: "{{ .app.key }}"
    task_block:
      id: settings_and_secrets
      changes:
        - id: write_the_plain_settings
          file:
            path: "/etc/{{ .app.key }}/{{ .app.key }}_settings.env"
            template: files/app_settings.env
            owner: root
            group: root
            permissions_mode: "0644"
        - id: write_the_secrets
          file:
            path: "/etc/{{ .app.key }}/{{ .app.key }}.env"
            template: files/app_secrets.env
            owner: root
            group: root
            permissions_mode: "0600"
        - id: write_the_database_settings
          file:
            path: "/etc/{{ .app.key }}/{{ .app.key }}_database.env"
            template: files/app_database.env
            owner: root
            group: root
            permissions_mode: "0600"
      activate:
        - id: restart_the_live_web_container
          systemd_service:
            name: "{{ .app.key }}-web-{{ .inputs.live_web_containers[.app.key].web_port }}.service"
            state: do_not_start_or_stop
        - id: restart_the_job_container
          systemd_service:
            name: "{{ .app.key }}-jobs.service"
            state: do_not_start_or_stop

  # The web containers, at every call. --------------------------------------

  - id: live_web_container_of_each_app
    when: "{{ .vars.live_release_runs }}"
    loop: "{{ .inputs.live_web_containers }}"
    as: web_container
    key: "{{ .web_container.key }}"
    task_block:
      id: live_web_container
      changes:
        - id: pull_the_image_of_the_live_release
          podman_image:
            image: "{{ .web_container.value.image }}"
            pull_image: when_missing
            registry_username: "{{ .inputs.container_registry_username }}"
            registry_password: "{{ .inputs.container_registry_password }}"
        # On a server that runs no web container of the app yet, such as a
        # new one, the asset directory gets the image's own files. A filled
        # directory stays as it is: after a deploy it also holds the
        # previous release's files.
        - id: fill_the_asset_directory_of_the_first_web_container
          shell:
            script: /usr/local/sbin/fill_web_asset_directory
            env:
              CONTAINER_NAME: "{{ .web_container.key }}-web-{{ .web_container.value.web_port }}"
              ASSET_DIRECTORY: "{{ .inputs.apps[.web_container.key].asset_directory }}"
              IMAGE: "{{ .web_container.value.image }}"
              PREVIOUS_IMAGE: ""
            skip_if_this_path_exists: "/var/lib/solo/web_assets/{{ .web_container.key }}-web-{{ .web_container.value.web_port }}"
            success_exit_codes: [0, 2]
            changed_when: {equals: ["{{ .this_node_task.exit_code }}", 2]}
        # The first start of a release on a server, as on a new system or for
        # a new app, runs the app's migrations first, as a deploy does.
        - id: run_the_migrations_before_the_first_start
          when:
            all:
              - "{{ .inputs.set_up_the_server }}"
              - not: {path_exists: "/etc/containers/systemd/{{ .web_container.key }}-web-{{ .web_container.value.web_port }}.container"}
          shell:
            script: set -f; /usr/local/sbin/run_app_migrations "$APP_NAME" "$IMAGE" $MIGRATION_COMMAND
            env:
              APP_NAME: "{{ .web_container.key }}"
              IMAGE: "{{ .web_container.value.image }}"
              MIGRATION_COMMAND: "{{ .inputs.apps[.web_container.key].migration_command }}"
        - id: install_the_quadlet_file_of_the_live_web_container
          podman_quadlet:
            name: "{{ .web_container.key }}-web-{{ .web_container.value.web_port }}.container"
            template: files/web_container.container
      activate:
        - id: run_the_live_web_container
          systemd_service:
            name: "{{ .web_container.key }}-web-{{ .web_container.value.web_port }}.service"
            state: running
      verify:
        # Request the health URL over HTTP at the web container's port. As
        # Caddy does, set Host to the app's public host name and
        # X-Forwarded-Proto to https.
        - id: wait_until_the_live_web_container_is_healthy
          wait_for:
            command_succeeds: >-
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5
              --header "Host: $PUBLIC_HOST_NAME" --header 'X-Forwarded-Proto: https'
              "http://127.0.0.1:$WEB_PORT$HEALTH_URL_PATH")" = 200
            env:
              PUBLIC_HOST_NAME: "{{ .inputs.public_host_names[.web_container.key] }}"
              WEB_PORT: "{{ .web_container.value.web_port }}"
              HEALTH_URL_PATH: "{{ .inputs.apps[.web_container.key].health_url_path }}"
            wait_at_most: 2m

  - id: new_web_container_of_each_app
    when: "{{ .vars.new_release_runs }}"
    loop: "{{ .inputs.new_web_containers }}"
    as: web_container
    key: "{{ .web_container.key }}"
    task_block:
      id: new_web_container
      changes:
        - id: pull_the_image_of_the_new_release
          podman_image:
            image: "{{ .web_container.value.image }}"
            pull_image: when_missing
            registry_username: "{{ .inputs.container_registry_username }}"
            registry_password: "{{ .inputs.container_registry_password }}"
        # The new release's asset files and the live release's, so a page
        # the live release rendered still loads after the switch.
        - id: fill_the_asset_directory_with_both_releases
          shell:
            script: /usr/local/sbin/fill_web_asset_directory
            env:
              CONTAINER_NAME: "{{ .web_container.key }}-web-{{ .web_container.value.web_port }}"
              ASSET_DIRECTORY: "{{ .inputs.apps[.web_container.key].asset_directory }}"
              IMAGE: "{{ .web_container.value.image }}"
              PREVIOUS_IMAGE: "{{ .inputs.live_web_containers[.web_container.key].image }}"
            success_exit_codes: [0, 2]
            changed_when: {equals: ["{{ .this_node_task.exit_code }}", 2]}
        - id: install_the_quadlet_file_of_the_new_web_container
          podman_quadlet:
            name: "{{ .web_container.key }}-web-{{ .web_container.value.web_port }}.container"
            template: files/web_container.container
      activate:
        - id: run_the_new_web_container
          systemd_service:
            name: "{{ .web_container.key }}-web-{{ .web_container.value.web_port }}.service"
            state: running
      verify:
        - id: wait_until_the_new_web_container_is_healthy
          wait_for:
            command_succeeds: >-
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5
              --header "Host: $PUBLIC_HOST_NAME" --header 'X-Forwarded-Proto: https'
              "http://127.0.0.1:$WEB_PORT$HEALTH_URL_PATH")" = 200
            env:
              PUBLIC_HOST_NAME: "{{ .inputs.public_host_names[.web_container.key] }}"
              WEB_PORT: "{{ .web_container.value.web_port }}"
              HEALTH_URL_PATH: "{{ .inputs.apps[.web_container.key].health_url_path }}"
            wait_at_most: 2m
      # A new web container that fails to start or to become healthy is
      # removed again; Caddy never sent it a request.
      on_failure:
        - id: remove_the_new_web_container_that_failed
          when: {equals: ["{{ .inputs.release_step }}", start_the_new_release_beside_the_old]}
          podman_quadlet:
            name: "{{ .web_container.key }}-web-{{ .web_container.value.web_port }}.container"
            state: file_and_service_removed_named_volumes_kept

  # The port that Caddy sends each app's requests to is recorded in
  # /var/lib/solo/live_web_ports/<app>. The new port is recorded just before
  # Caddy switches to it, so a run that stops between the two steps leaves a
  # record that the next run's find_the_live_and_new_web_ports reads, and
  # the next run's Caddy lists the same port.
  - id: record_the_live_web_port_of_each_app
    when: {not: "{{ .vars.requests_go_to_the_new_release }}"}
    loop: "{{ .inputs.live_web_containers }}"
    as: web_container
    file:
      path: "/var/lib/solo/live_web_ports/{{ .web_container.key }}"
      content: "{{ .web_container.value.web_port }}\n"
      owner: root
      group: root
      permissions_mode: "0644"
  - id: record_the_new_web_port_as_the_live_one
    when: "{{ .vars.requests_go_to_the_new_release }}"
    loop: "{{ .inputs.new_web_containers }}"
    as: web_container
    file:
      path: "/var/lib/solo/live_web_ports/{{ .web_container.key }}"
      content: "{{ .web_container.value.web_port }}\n"
      owner: root
      group: root
      permissions_mode: "0644"

  # Caddy and cloudflared come from their vendors' apt repositories, because
  # Debian 13 ships Caddy 2.6.2 from 2022 and has no cloudflared. The signing
  # keys are committed as the vendors publish them. Caddy's key comes from
  # https://dl.cloudsmith.io/public/caddy/stable/gpg.key and Cloudflare's from
  # https://pkg.cloudflare.com/cloudflare-public-v2.gpg. Updates arrive with
  # the security updates, because base_server's unattended-upgrades settings
  # allow both repositories.
  - id: add_the_caddy_apt_repository
    when: "{{ .inputs.set_up_the_server }}"
    apt_repository:
      name: caddy
      uris: [https://dl.cloudsmith.io/public/caddy/stable/deb/debian]
      suites: [any-version]
      components: [main]
      signing_key_source: files/caddy_apt_signing_key.asc
  - id: add_the_cloudflared_apt_repository
    when: "{{ .inputs.set_up_the_server }}"
    apt_repository:
      name: cloudflared
      uris: [https://pkg.cloudflare.com/cloudflared]
      suites: [any]
      components: [main]
      signing_key_source: files/cloudflare_apt_signing_key.gpg
  # The packages stay outside the blocks that start Caddy and cloudflared. As
  # a result, MMX does not restart Caddy or cloudflared again after
  # unattended-upgrades updated and restarted the service between runs.
  - id: install_caddy_and_cloudflared
    when: "{{ .inputs.set_up_the_server }}"
    apt_package:
      packages:
        - {name: caddy, version: newest_when_first_installed}
        - {name: cloudflared, version: newest_when_first_installed}

  # Caddy. The new Caddyfile is checked before replacing the live Caddyfile.
  # A reload drops no connection. Requests Caddy is already forwarding finish
  # with the web container already handling them. New requests follow the
  # list of web containers in the new Caddyfile.
  - when:
      any:
        - "{{ .inputs.set_up_the_server }}"
        - path_exists: /etc/caddy/Caddyfile
    task_block:
      id: caddy
      changes:
        - id: write_the_caddyfile
          file:
            path: /etc/caddy/Caddyfile
            template: files/Caddyfile
            owner: root
            group: root
            permissions_mode: "0644"
            check_new_file:
              shell:
                script: caddy validate --adapter caddyfile --config "$NEW_FILE"
                dryrun: caddy validate --adapter caddyfile --config "$NEW_FILE"
                env:
                  NEW_FILE: "{{ .new_file.path }}"
        # Caddy's own unit doesn't restart Caddy after a crash, and the tunnel
        # connector stops with Caddy (BindsTo= below). Without this, one crash
        # takes the site down until a person starts Caddy again.
        - id: restart_caddy_after_a_crash
          systemd_unit:
            name: caddy.service
            drop_in: restart_after_a_crash.conf
            content: |
              # Managed by MMX from roles/apps_and_tunnel/main.yml in the systems repository.
              [Service]
              Restart=on-failure
              RestartSec=5s
      activate:
        - id: run_caddy
          systemd_service:
            name: caddy
            state: running
            start_at_boot: true
            refresh: reload
      verify:
        - id: wait_until_caddy_accepts_connections
          wait_for:
            tcp_port_accepts_connections: 80
            wait_at_most: 10s

  # cloudflared joins the tunnel only once each app answers through Caddy: the
  # moment it joins, Cloudflare may send it every request.
  - id: wait_until_each_app_answers_through_caddy_before_joining_the_tunnel
    when:
      all:
        - "{{ .inputs.set_up_the_server }}"
        - not: {path_exists: /etc/systemd/system/cloudflared.service}
    loop: "{{ .inputs.apps }}"
    as: app
    wait_for:
      command_succeeds: >-
        test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5
        --header "Host: $PUBLIC_HOST_NAME" --header 'X-Forwarded-Proto: https'
        "http://127.0.0.1$HEALTH_URL_PATH")" = 200
      env:
        PUBLIC_HOST_NAME: "{{ .inputs.public_host_names[.app.key] }}"
        HEALTH_URL_PATH: "{{ .app.value.health_url_path }}"
      wait_at_most: 2m

  # cloudflared uses the tunnel token to connect to Cloudflare. For each
  # public host name, cloudflared sends requests to Caddy on solo01. The
  # tunnel is locally managed: /etc/cloudflared/config.yml holds the routes
  # from the systems repository. cloudflared's systemd unit is bound to
  # Caddy: when Caddy stops, cloudflared leaves the tunnel, and Caddy's start
  # brings the connector back.
  - id: create_the_cloudflared_settings_directory
    when: "{{ .inputs.set_up_the_server }}"
    directory:
      path: /etc/cloudflared
      owner: root
      group: root
      permissions_mode: "0755"
  - id: cloudflared_tunnel_connector
    when: "{{ .inputs.set_up_the_server }}"
    task_block:
      id: cloudflared
      changes:
        - id: write_the_tunnel_routes
          file:
            path: /etc/cloudflared/config.yml
            template: files/cloudflared_config.yml
            owner: root
            group: root
            permissions_mode: "0644"
            check_new_file:
              shell:
                script: cloudflared tunnel --config "$NEW_FILE" ingress validate
                dryrun: cloudflared tunnel --config "$NEW_FILE" ingress validate
                env:
                  NEW_FILE: "{{ .new_file.path }}"
        # systemd reads /etc/cloudflared/tunnel_token.env as root before
        # cloudflared starts.
        - id: write_the_tunnel_token
          file:
            path: /etc/cloudflared/tunnel_token.env
            content: "TUNNEL_TOKEN={{ .inputs.cloudflare_tunnel_token }}\n"
            owner: root
            group: root
            permissions_mode: "0600"
        - id: install_the_cloudflared_unit
          systemd_unit:
            name: cloudflared.service
            content: |
              # Managed by MMX from roles/apps_and_tunnel/main.yml in the systems repository.
              [Unit]
              Description=Cloudflare Tunnel connector for the apps
              After=network-online.target caddy.service
              Wants=network-online.target
              # Caddy stops: cloudflared stops too, and leaves the tunnel.
              BindsTo=caddy.service

              [Service]
              Type=notify
              # It needs no privileges: it dials out and talks to Caddy.
              DynamicUser=yes
              EnvironmentFile=/etc/cloudflared/tunnel_token.env
              # apt updates it; on the stop signal it lets the requests in
              # flight finish for up to 30 seconds (its grace period). Its
              # readiness, http://127.0.0.1:20241/ready, answers 200 while it
              # holds a connection to Cloudflare, and MMWatchdog asks it.
              ExecStart=/usr/bin/cloudflared --no-autoupdate tunnel --metrics 127.0.0.1:20241 --config /etc/cloudflared/config.yml run
              Restart=on-failure
              RestartSec=5s

              [Install]
              # caddy.service: Caddy's start starts cloudflared again.
              WantedBy=multi-user.target caddy.service
      activate:
        - id: run_cloudflared
          systemd_service:
            name: cloudflared
            state: running
            start_at_boot: true

  # The deploy's last step: each old web container gets the stop signal and up
  # to 30 seconds to finish its requests (StopTimeout in its Quadlet file).
  # Then MMX stops the old web container and removes the container's service
  # and Quadlet file. It comes after the Caddy switch above.
  - id: stop_the_old_web_container_of_each_app
    when: {not: "{{ .vars.live_release_runs }}"}
    loop: "{{ .inputs.live_web_containers }}"
    as: web_container
    podman_quadlet:
      name: "{{ .web_container.key }}-web-{{ .web_container.value.web_port }}.container"
      state: file_and_service_removed_named_volumes_kept

  # Outside a deploy, each app's port that Caddy does not send requests to
  # runs no web container. This removes a new web container left by a deploy
  # that stopped before the Caddy switch.
  - id: remove_a_new_web_container_that_a_stopped_deploy_left
    when: {not: "{{ .vars.new_release_runs }}"}
    loop: "{{ .inputs.new_web_containers }}"
    as: web_container
    podman_quadlet:
      name: "{{ .web_container.key }}-web-{{ .web_container.value.web_port }}.container"
      state: file_and_service_removed_named_volumes_kept

  # Each app's job container, <app>-jobs.service, runs the web containers'
  # release. The job container changes to the new release only after the old
  # web containers stopped. The job container restarts, so the old worker
  # finishes the current job, then the new worker starts. Jobs wait in the
  # Postgres queue while the job container restarts.
  - id: the_job_containers_run_the_live_release
    when: "{{ .vars.live_release_runs }}"
    set_vars:
      job_containers: "{{ .inputs.live_web_containers }}"
  - id: the_job_containers_run_the_new_release
    when: {not: "{{ .vars.live_release_runs }}"}
    set_vars:
      job_containers: "{{ .inputs.new_web_containers }}"
  - id: job_container_of_each_app
    when:
      all:
        # An app whose jobs_command is "" has no background jobs and no job container.
        - not: {equals: ["{{ .inputs.apps[.job_container.key].jobs_command }}", ""]}
        - any:
            - "{{ .inputs.set_up_the_server }}"
            - path_exists: "/etc/containers/systemd/{{ .job_container.key }}-jobs.container"
    loop: "{{ .vars.job_containers }}"
    as: job_container
    key: "{{ .job_container.key }}"
    task_block:
      id: job_container
      changes:
        - id: install_the_quadlet_file_of_the_job_container
          podman_quadlet:
            name: "{{ .job_container.key }}-jobs.container"
            template: files/jobs_container.container
      activate:
        - id: run_the_job_container
          systemd_service:
            name: "{{ .job_container.key }}-jobs.service"
            state: running

  # An app whose jobs_command is "" (no background jobs) has no job
  # container. An app that had jobs and was changed to have none must not
  # keep its old worker running: this removes the job container's service
  # and Quadlet file. For an app that never had a job container, it changes
  # nothing. The waiting jobs stay in the Postgres queue.
  - id: remove_the_job_container_of_an_app_that_has_no_jobs
    when:
      all:
        - "{{ .inputs.set_up_the_server }}"
        - {equals: ["{{ .app.value.jobs_command }}", ""]}
    loop: "{{ .inputs.apps }}"
    as: app
    podman_quadlet:
      name: "{{ .app.key }}-jobs.container"
      state: file_and_service_removed_named_volumes_kept

  # Each deploy pulls a new image. Once a week, podman-image-cleanup.service
  # deletes images that no container uses and that were made more than
  # 7 days ago. A rollback to an older release pulls the older release's
  # image again.
  - id: weekly_cleanup_of_unused_images
    when: "{{ .inputs.set_up_the_server }}"
    task_block:
      id: podman_image_cleanup
      changes:
        - id: install_the_image_cleanup_service
          systemd_unit:
            name: podman-image-cleanup.service
            template: ../../files_used_by_several_roles/podman_image_cleanup.service
        - id: install_the_image_cleanup_timer
          systemd_unit:
            name: podman-image-cleanup.timer
            template: ../../files_used_by_several_roles/podman_image_cleanup.timer
      activate:
        - id: run_the_image_cleanup_timer
          systemd_service:
            name: podman-image-cleanup.timer
            state: running
            start_at_boot: true
