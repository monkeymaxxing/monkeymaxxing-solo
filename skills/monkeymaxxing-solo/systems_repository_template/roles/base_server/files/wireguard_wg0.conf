{{- /*
  wg0, solo01's interface on the WireGuard network, in wg-quick's format.
  MMX adds the PrivateKey line. The private key is in
  /etc/wireguard/wg0.private_key and is reused from the first boot. It
  reads the role inputs private_ip, wireguard_listen_port,
  laptop_private_ip and laptop_wireguard_public_key.

  The laptop is the only peer. It roams between networks, so solo01 keeps no
  Endpoint for it: solo01 learns the laptop's address from the laptop's
  own packets.
*/ -}}
# Managed by MMX from roles/base_server/files/wireguard_wg0.conf in the
# systems repository. The WireGuard network is wireguard_network in
# inventories/servers.yml. It must not overlap a network this server
# already uses, such as a provider's private network on another network
# card: wg0 would take that network's traffic, its gateway's too.
[Interface]
Address = {{ .inputs.private_ip }}/16
ListenPort = {{ .inputs.wireguard_listen_port }}

[Peer]
# The laptop that manages solo01.
PublicKey = {{ .inputs.laptop_wireguard_public_key }}
AllowedIPs = {{ .inputs.laptop_private_ip }}/32
