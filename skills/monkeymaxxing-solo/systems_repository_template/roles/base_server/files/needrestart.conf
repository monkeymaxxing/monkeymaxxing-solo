# Managed by MMX. needrestart finds the services that still use an old
# library after an update, and restarts them at once, so a fixed library is
# in use the same day. A Postgres update therefore restarts Postgres for a
# second or two; the apps reconnect by themselves.
$nrconf{restart} = 'a';
# This service waits for an ongoing unattended upgrade to finish. Restarting
# it from that upgrade's needrestart hook would wait for the hook itself.
$nrconf{override_rc}{qr(^unattended-upgrades\.service$)} = 0;
# The web containers, Caddy and cloudflared carry the requests, so no update
# restarts them: a restart while solo01 is the only server serving fails
# requests for a few seconds. A web container's app uses the libraries in
# its image, so the restart would only refresh the host side. The next
# deploy, which restarts the containers, and the planned reboot after the
# update pick up the new libraries. The job containers still restart: no
# request waits on them.
$nrconf{override_rc}{qr(^[a-z0-9_-]+-web-[0-9]+\.service$)} = 0;
$nrconf{override_rc}{qr(^caddy\.service$)} = 0;
$nrconf{override_rc}{qr(^cloudflared\.service$)} = 0;
