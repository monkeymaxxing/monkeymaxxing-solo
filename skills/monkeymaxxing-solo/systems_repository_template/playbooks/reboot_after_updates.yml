# Reboots solo01 when installed updates need a reboot, inside the weekly
# maintenance window you chose (maintenance_window in mmx_project_settings.yml),
# then waits until solo01 does its work again. No server reboots by itself:
# you or your coding agent run it, usually once a week, after MMWatchdog's
# security_updates checks or the weekly review show that a reboot waits.
#
#   mmx run reboot_after_updates
#
# A reboot of solo01, the only server, takes the apps down for under a minute
# on a cloud server. That is why the playbook refuses outside the window.
# To reboot at another time, for an update that cannot wait (a flaw that
# attackers exploit in the running kernel), add
# --var reboot_outside_the_maintenance_window=true after you decided that.
#
# The steps:
#   1. Find out whether a reboot waits (/var/run/reboot-required exists) and
#      whether the window is open. With no reboot waiting, the run ends
#      here, successfully. With a reboot waiting outside the window, the run
#      says when the window opens and changes nothing.
#   2. Pause MMWatchdog's alerts for the length of the wait, and reboot.
#      A failure before the reboot ends the pause again.
#   3. Wait until Postgres answers, Caddy and the tunnel connector run, each
#      app answers through Caddy, and MMWatchdog runs; then end the pause.
command_line_vars:
  reboot_outside_the_maintenance_window:
    type: boolean
    default: false

fleet_stages:
  - id: find_whether_a_reboot_waits_and_may_run_now
    nodes: solo_server
    on_node_failure: stop_run
    node_tasks:
      - id: the_come_back_wait_is_whole_minutes_from_1_to_45
        assert:
          that:
            matches: ["{{ .vars.come_back_wait_after_a_reboot }}", '^([1-9]|[1-3][0-9]|4[0-5])m$']
          message: >-
            come_back_wait_after_a_reboot in mmx_project_settings.yml is
            "{{ .vars.come_back_wait_after_a_reboot }}". Use whole minutes from 1m to 45m,
            such as 3m. Nothing changed.
      - id: whether_a_reboot_waits_and_may_run_now
        shell:
          script: python3 -I -c "$PROGRAM"
          dryrun: python3 -I -c "$PROGRAM"
          env:
            PROGRAM: |
              import datetime, json, os
              if not os.path.exists('/var/run/reboot-required'):
                  print(json.dumps({'a_reboot_waits': False, 'the_reboot_may_run_now': False, 'why': 'no reboot waits'}))
                  raise SystemExit(0)
              if os.environ['REBOOT_OUTSIDE_THE_WINDOW'] == 'true':
                  print(json.dumps({'a_reboot_waits': True, 'the_reboot_may_run_now': True, 'why': 'you allowed a reboot outside the maintenance window'}))
                  raise SystemExit(0)
              days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday']
              now = datetime.datetime.now(datetime.timezone.utc)
              hour, minute = (int(part) for part in os.environ['WINDOW_STARTS_AT'].split(':'))
              length = datetime.timedelta(minutes=int(os.environ['WINDOW_LENGTH_MINUTES']))
              # The window that began on this week's window day, or last week's if that is still ahead.
              start = (now - datetime.timedelta(days=(now.weekday() - days.index(os.environ['WINDOW_WEEKDAY'])) % 7)).replace(hour=hour, minute=minute, second=0, microsecond=0)
              if start > now:
                  start -= datetime.timedelta(days=7)
              if start <= now < start + length:
                  print(json.dumps({'a_reboot_waits': True, 'the_reboot_may_run_now': True, 'why': 'the maintenance window is open until ' + (start + length).strftime('%H:%M UTC')}))
              else:
                  opens = start + datetime.timedelta(days=7)
                  print(json.dumps({'a_reboot_waits': True, 'the_reboot_may_run_now': False, 'why': 'a reboot waits, and the maintenance window opens at ' + opens.strftime('%A %H:%M UTC') + '. Run again then, or add --var reboot_outside_the_maintenance_window=true after you decided the reboot cannot wait'}))
            REBOOT_OUTSIDE_THE_WINDOW: "{{ .vars.reboot_outside_the_maintenance_window }}"
            WINDOW_WEEKDAY: "{{ .vars.maintenance_window.weekday }}"
            WINDOW_STARTS_AT: "{{ .vars.maintenance_window.starts_at }}"
            WINDOW_LENGTH_MINUTES: "{{ .vars.maintenance_window.length_minutes }}"
          changed_when: false
      - id: say_why_no_reboot_runs
        when:
          not: "{{ .node_tasks.whether_a_reboot_waits_and_may_run_now.stdout_json.the_reboot_may_run_now }}"
        show: "{{ .node.name }}: {{ .node_tasks.whether_a_reboot_waits_and_may_run_now.stdout_json.why }}"
    outputs:
      the_reboot_may_run_now: "{{ .node_tasks.whether_a_reboot_waits_and_may_run_now.stdout_json.the_reboot_may_run_now }}"

  # 2. The alert pause: a whole-server MMWatchdog maintenance window, so the
  # server's own alerts wait while it reboots. The pause lasts the longest the
  # run waits for solo01, plus a margin: the come-back wait, then the wait
  # below for solo01's checks (5 minutes), plus 2 minutes: 10 minutes by
  # default. A run that fails or dies leaves the alerts paused no longer than
  # it would have waited. The outside alarm needs no pause: its delay is at
  # least 3 minutes and solo01 checks in again at boot.
  - id: reboot_solo01
    nodes: solo_server
    when: "{{ .outputs.find_whether_a_reboot_waits_and_may_run_now[.node.name].the_reboot_may_run_now }}"
    on_node_failure: stop_run
    node_tasks:
      - task_block:
          id: pause_the_alerts_of_the_server
          changes:
            - id: hold_the_alerts_of_the_server
              shell:
                script: '/usr/local/bin/mmwatchdog maintenance on --every-check-group --for "$(( ${COME_BACK_WAIT%m} + 7 ))m" --reason "reboot_after_updates: waits $COME_BACK_WAIT for the server to come back"'
                env:
                  COME_BACK_WAIT: "{{ .vars.come_back_wait_after_a_reboot }}"
          on_failure:
            - id: end_the_alert_pause_that_the_reboot_never_used
              shell:
                script: /usr/local/bin/mmwatchdog maintenance off --every-check-group
      - id: reboot_the_server
        reboot:
          run_only_if_this_path_exists: /var/run/reboot-required
          wait_at_most: "{{ .vars.come_back_wait_after_a_reboot }}"

  # 3. The pause ends in cleanup, whether solo01 does its work or not: a
  # server that does not do its work again alerts at once, and the run
  # reports the failure too.
  - id: wait_until_solo01_does_its_work_again
    nodes: solo_server
    when: "{{ .outputs.find_whether_a_reboot_waits_and_may_run_now[.node.name].the_reboot_may_run_now }}"
    node_tasks:
      - task_block:
          id: wait_until_the_server_does_its_work_then_end_its_alert_pause
          changes:
            - id: wait_until_postgres_answers
              wait_for:
                command_succeeds: '"/usr/lib/postgresql/$POSTGRESQL_MAJOR_VERSION/bin/pg_isready" --quiet --port 5432'
                env:
                  POSTGRESQL_MAJOR_VERSION: "{{ .vars.postgresql_major_version }}"
                wait_at_most: 5m
            - id: wait_until_caddy_runs
              wait_for:
                command_succeeds: systemctl is-active --quiet caddy.service
                wait_at_most: 5m
            - id: wait_until_the_tunnel_connector_is_connected_to_cloudflare
              wait_for:
                command_succeeds: curl --silent --fail --max-time 5 http://127.0.0.1:20241/ready
                wait_at_most: 5m
            - id: wait_until_each_app_answers_through_caddy
              loop: "{{ .vars.apps }}"
              as: app
              wait_for:
                command_succeeds: >-
                  test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5
                  --header "Host: $PUBLIC_HOST_NAME" --header 'X-Forwarded-Proto: https'
                  "http://127.0.0.1$HEALTH_URL_PATH")" = 200
                env:
                  PUBLIC_HOST_NAME: "{{ .vars.public_host_names[.app.key] }}"
                  HEALTH_URL_PATH: "{{ .app.value.health_url_path }}"
                wait_at_most: 5m
            - id: wait_until_mmwatchdog_runs
              wait_for:
                command_succeeds: systemctl is-active --quiet mmwatchdog.service
                wait_at_most: 5m
          cleanup:
            - id: release_the_alerts_of_the_server
              shell:
                script: /usr/local/bin/mmwatchdog maintenance off --every-check-group
