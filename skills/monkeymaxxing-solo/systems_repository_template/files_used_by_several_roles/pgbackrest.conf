{{- /*
  pgBackRest's settings, /etc/pgbackrest/pgbackrest.conf, owned by root and
  readable by the group postgres: for the backups (roles/postgres_and_backups)
  and for a restore (playbooks/restore_database.yml). One template for both,
  so a restore reads the repository exactly where and as the backups wrote
  it: the same bucket path, address style, and cipher.

  It reads the mapping pgbackrest_settings, which the caller sets with
  set_vars just before: r2_s3_endpoint, bucket_name, bucket_key_id,
  bucket_secret_key, repository_cipher_passphrase, data_directory (the
  cluster's data directory), and the two backup lengths of vars.backups:
  keep_database_backups_for_days and lock_backups_against_deletion_for_days.

  The lengths are checked here, on every run that writes this file, so a
  value below its minimum stops the run before anything changes. A role
  input can arrive as a decimal number, so each test reads the written number.
*/ -}}
{{- $keep := .vars.pgbackrest_settings.keep_database_backups_for_days -}}
{{- $lock := .vars.pgbackrest_settings.lock_backups_against_deletion_for_days -}}
{{- if not (regexMatch "^[0-9]+$" (toString $keep)) }}{{ fail (printf "backups.keep_database_backups_for_days is %v. Use a whole number of days, 14 or more, such as 21. Nothing changed." $keep) }}{{ end -}}
{{- if lt (int $keep) 14 }}{{ fail (printf "backups.keep_database_backups_for_days is %v, below the minimum of 14. A full backup runs every week, and the weekly restore check needs the previous full backup still present. Nothing changed." $keep) }}{{ end -}}
{{- if not (regexMatch "^[0-9]+$" (toString $lock)) }}{{ fail (printf "backups.lock_backups_against_deletion_for_days is %v. Use a whole number of days from 8 up to keep_database_backups_for_days, such as 14. Nothing changed." $lock) }}{{ end -}}
{{- if lt (int $lock) 8 }}{{ fail (printf "backups.lock_backups_against_deletion_for_days is %v, below the minimum of 8. A lock shorter than a week and a day could end before the next weekly full backup protects the data. Nothing changed." $lock) }}{{ end -}}
{{- if gt (int $lock) (int $keep) }}{{ fail (printf "backups.lock_backups_against_deletion_for_days is %v, more than backups.keep_database_backups_for_days (%v). pgBackRest would try to delete backups that are still locked. Lower the lock or raise keep_database_backups_for_days. Nothing changed." $lock $keep) }}{{ end -}}
# Managed by MMX from files_used_by_several_roles/pgbackrest.conf in the systems repository. MMX
# hides this file's content in its output and results.
[global]
# The only repository: the Cloudflare R2 bucket, through R2's S3-compatible
# API. Its Bucket Lock keeps every object for
# backups.lock_backups_against_deletion_for_days (14 in the template), even
# after pgBackRest or an attacker deletes it.
repo1-type=s3
repo1-s3-endpoint={{ .vars.pgbackrest_settings.r2_s3_endpoint }}
# R2 has one region, named auto.
repo1-s3-region=auto
repo1-s3-bucket={{ .vars.pgbackrest_settings.bucket_name }}
# R2 answers a bucket at the account's own host name, with the bucket in the
# path, not as a host name of the bucket.
repo1-s3-uri-style=path
repo1-s3-key={{ .vars.pgbackrest_settings.bucket_key_id }}
repo1-s3-key-secret={{ .vars.pgbackrest_settings.bucket_secret_key }}
repo1-path=/pgbackrest
# pgBackRest encrypts every file before it leaves the server: the bucket's
# lock protects the backups from being deleted, not from being read by
# whoever takes over the Cloudflare account.
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass={{ .vars.pgbackrest_settings.repository_cipher_passphrase }}
# Full backups are kept for backups.keep_database_backups_for_days (21 in
# the template), each with its daily differential backups and the
# write-ahead log after it, so a restore reaches any moment of that period.
# A full backup runs every weekly_work_day, and pgBackRest deletes a full
# backup after the period ends. The minimum is 14 days: the weekly restore
# check needs the previous full backup still present. The lock cannot be
# longer than this period (see the checks at the top of this file).
repo1-retention-full-type=time
repo1-retention-full={{ int $keep }}
# Each backup also holds the write-ahead log it needs to be consistent, so
# the weekly restore check can start a restored copy with only the backup's
# own files (--type=immediate), without the archive.
archive-copy=y
# Cloudflare R2 Bucket Locks block overwriting existing objects as well as
# deleting them. With resume=n, pgBackRest writes each backup's manifest once
# at the end of the backup instead of overwriting backup.manifest.copy
# repeatedly during the run.
resume=n
# Start a backup at once, with a checkpoint, instead of waiting for the next
# scheduled one.
start-fast=y
# Backups and restores copy four files at a time. Each file waits for the
# bucket's answer, so one at a time is slow to a far-away bucket.
process-max=4

# The stanza main: the cluster in its data directory. Postgres answers on its
# local socket, at port 5432.
[main]
pg1-path={{ .vars.pgbackrest_settings.data_directory }}
pg1-port=5432
